<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabajo de Nivelación - JavaScript</title>
    <style>
        :root {
            --bg-primary: #bebc21;
            --bg-card: #181816;
            --accent: #fffb00;
            --accent-hover: #fffbfb;
            --text-light: #030103;
            --text-muted: #161515;
            --border: #970404;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var();
            display: flex;
            min-height: 100vh;
        }

       aside h2 {
            color: var(--accent);
            font-size: 1.4rem;
            text-align: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 1rem;
        }

      

        aside ul {
            list-style: none;
        }

        aside li {
            margin-bottom: 0.5rem;
        }

        aside a {
            color: var(--text-light);
            text-decoration: none;
            padding: 0.75rem 1rem;
            display: block;
            border-radius: 6px;
            transition: background 0.3s;
        }

        aside a:hover {
            background-color: var(--border);
            color: var(--accent);
        }

        /* Main Content */
        main {
            flex: 1;
            padding: 2.5rem;
            overflow-y: auto;
        }

        header {
            margin-bottom: 2.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        header h1 {
            color: var(--accent);
            font-size: 2rem;
        }

        header p {
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .card h3 {
            color: var(--accent);
            margin-bottom: 0.75rem;
        }

        .card p {
            font-size: 0.9rem;
            color: #000000;
            margin-bottom: 1.2rem;
            line-height: 1.4;
        }

        .btn {
            background-color: var(--accent);
            color: #b90a0a;
            font-weight: bold;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .btn:hover {
            background-color: var(--accent-hover);
            color: #0a0ddf;
        }

        .output-box {
            margin-top: 1rem;
            background-color: var(--bg-primary);
            border: 1px dashed var(--border);
            padding: 0.75rem;
            border-radius: 5px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #0b19df;
            white-space: pre-wrap;
            min-height: 60px;
        }

        @media (max-width: 68px) {
            body {
                flex-direction: column;
            }
            aside {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Panel de Navegación Lateral -->
    <aside>
     
       
        </ul>
    </aside>

    <!-- Contenido Principal -->
    <main>
        <header>
            <h1>Ejecución de Algoritmos</h1>
            <p>Dar click para ejecutar algoritmos: JavaScript.</p>
        </header>

        <div class="grid-container">

            <!-- Algoritmo 1: Condicionales -->
            <div class="card" id="alg-1">
                <div>
                    <h3>1. Comisión por Ventas</h3>
       
                </div>
                <button class="btn" onclick="ejecutarComisionVentas()">Condicional</button>
             
            </div>

            <!-- Algoritmo 2: Condicionales -->
            <div class="card" id="alg-2">
                <div>
                    <h3>2. Evaluación de Préstamo</h3>

                </div>
                <button class="btn" onclick="ejecutarPrestamo()">Condicional</button>
             
            </div>

            <!-- Algoritmo 3: Condicionales -->
            <div class="card" id="alg-3">
                <div>
                    <h3>3. Tarifa de Alojamiento</h3>
          
                </div>
                <button class="btn" onclick="ejecutarAlojamiento()">Condicional</button>
            
            </div>

            <!-- Algoritmo 4: Bucles -->
            <div class="card" id="alg-4">
                <div>
                    <h3>4. Registro de Ventas</h3>
           
                </div>
                <button class="btn" onclick="ejecutarRegistroVentas()">Bucles</button>
          
            </div>

            <!-- Algoritmo 5: Bucles -->
            <div class="card" id="alg-5">
                <div>
                    <h3>5. Control de Inventario</h3>
          
                </div>
                <button class="btn" onclick="ejecutarInventario()">Bucles</button>
        
            </div>

            <!-- Algoritmo 6: Bucles -->
            <div class="card" id="alg-6">
                <div>
                    <h3>6. Análisis de Temperaturas</h3>
          
                </div>
                <button class="btn" onclick="ejecutarTemperaturas()">Bucles</button>
              
            </div>

        </div>
    </main>

    <script src="main.js"></script>
</body>
</html>
